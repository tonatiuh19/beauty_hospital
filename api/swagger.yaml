openapi: 3.0.3
info:
  title: All Beauty Luxury & Wellness API
  version: 1.0.0
  description: |
    Express monolith in `api/index.ts`. Admin routes (except `/api/admin/auth/*`)
    require a Bearer JWT. Roles match the admin navigation. Patient portal routes
    use an active `users_sessions` row plus `patient_id`.
servers:
  - url: /api
    description: Same-origin Vite / Vercel

tags:
  - name: Health
  - name: Public
  - name: Auth
  - name: Appointments
  - name: Check-in
  - name: Patient
  - name: Admin Auth
  - name: Admin Dashboard
  - name: Admin Services
  - name: Admin Patients
  - name: Admin Medical Records
  - name: Admin Users
  - name: Admin Appointments
  - name: Admin Contracts
  - name: Admin Payments
  - name: Admin Invoices
  - name: Admin Settings

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data: {}
        message:
          type: string
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

security: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: OK
  /ping:
    get:
      tags: [Health]
      summary: Ping
      responses:
        "200":
          description: pong
  /demo:
    get:
      tags: [Public]
      summary: Demo payload
      responses:
        "200":
          description: OK
  /brand/logo:
    get:
      tags: [Public]
      summary: Brand logo PNG for emails and remote clients
      responses:
        "200":
          description: image/png
  /content/{slug}:
    get:
      tags: [Public]
      summary: Published content page (terms, privacy)
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published page
        "404":
          description: Unpublished or missing
        "404":
          description: Logo file not bundled on this host

  /services:
    get:
      tags: [Public]
      summary: List public services
      description: Active October 2026 Venus packages. Each row includes `price` (package or per-size starting price), `package_sessions`, `legal_template` (bliss|legacy|velocity), and `area_catalog`. Bliss/Legacy book one zone at `price`. Velocity areas include `size` and `price`; checkout may mix 1–4 zones from the full Velocity catalog and charges the sum.
      responses:
        "200":
          description: OK
  /services/{id}:
    get:
      tags: [Public]
      summary: Get service by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  /business-hours:
    get:
      tags: [Public]
      summary: List weekly business hours
      responses:
        "200":
          description: OK
  /business-hours/day/{day}:
    get:
      tags: [Public]
      summary: Business hours for one weekday (0=Sunday)
      parameters:
        - in: path
          name: day
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 6
      responses:
        "200":
          description: OK

  /blocked-dates:
    get:
      tags: [Public]
      summary: List blocked dates
      responses:
        "200":
          description: OK
  /blocked-dates/check:
    get:
      tags: [Public]
      summary: Check if a date/time is blocked
      parameters:
        - in: query
          name: date
          schema:
            type: string
        - in: query
          name: time
          schema:
            type: string
      responses:
        "200":
          description: OK

  /auth/register:
    post:
      tags: [Auth]
      summary: Legacy password register
      responses:
        "200":
          description: OK
  /auth/login:
    post:
      tags: [Auth]
      summary: Legacy password login
      responses:
        "200":
          description: OK
  /auth/check-user:
    post:
      tags: [Auth]
      summary: Check if a patient exists by email
      responses:
        "200":
          description: OK
  /auth/send-code:
    post:
      tags: [Auth]
      summary: Send patient OTP
      responses:
        "200":
          description: OK
  /auth/verify-code:
    post:
      tags: [Auth]
      summary: Verify patient OTP (opens a 24h session row)
      responses:
        "200":
          description: Patient object
  /auth/create-user:
    post:
      tags: [Auth]
      summary: Create patient during booking
      responses:
        "200":
          description: OK

  /appointments:
    get:
      tags: [Appointments]
      summary: List appointments for a patient (session or admin JWT)
      parameters:
        - in: query
          name: patientId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "401":
          description: Auth required
    post:
      tags: [Appointments]
      summary: Create appointment (legacy, unused by current UI)
      responses:
        "200":
          description: OK
  /appointments/{id}:
    get:
      tags: [Appointments]
      summary: Get appointment (patient session or admin JWT)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
    put:
      tags: [Appointments]
      summary: Update appointment (admin JWT)
      security:
        - adminBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
    delete:
      tags: [Appointments]
      summary: Cancel appointment (admin JWT)
      security:
        - adminBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /appointments/booked-slots:
    get:
      tags: [Appointments]
      summary: Booked slots for a date
      responses:
        "200":
          description: OK
  /appointments/quote:
    post:
      tags: [Appointments]
      summary: Quote catalog price and duration for selected zones
      description: Public. Validates Bliss/Legacy (exactly one catalog area) or Velocity (1–4 areas from the combined size catalog). Returns `catalog_amount` (sum of Velocity area prices, or the Bliss/Legacy package price), `amount` (0 when `patient_id` has remaining matching sessions or an active 90% guarantee), `duration_minutes`, `skip_payment`, and `suggested_next_date`. Does not create a PaymentIntent or appointment.
      responses:
        "200":
          description: Quote
        "400":
          description: Invalid zone selection
        "404":
          description: Service not found
  /appointments/book-with-payment:
    post:
      tags: [Appointments]
      summary: Create Stripe PaymentIntent for online booking
      description: Charges catalog price (client `payment_amount` is ignored). Bliss/Legacy require exactly one `selected_areas` value. Velocity accepts 1–4 areas from the combined Velocity catalog and charges the sum of each area's size price. If the patient already has remaining sessions on a matching open contract (same service, or same Velocity zones), or an active 90% guarantee, payment is skipped (`skip_payment`) and `suggested_next_date` may be returned. Otherwise the appointment is created only after payment succeeds. `booked_by_patient_id` is stored when booking for someone else. PaymentIntents use `automatic_payment_methods.enabled` without `allow_redirects: never`.
      responses:
        "200":
          description: OK
        "409":
          description: Slot conflict
  /appointments/confirm-payment:
    post:
      tags: [Appointments]
      summary: Confirm Stripe payment and finalize booking
      description: Idempotent. Same PaymentIntent will not create a second appointment. Prefer the webhook as the source of truth.
      responses:
        "200":
          description: OK
  /stripe/webhook:
    post:
      tags: [Payments]
      summary: Stripe webhook
      description: Verifies `Stripe-Signature`. Handles `payment_intent.succeeded` (fulfill booking) and `charge.refunded` (sync refund status). Requires raw JSON body.
      responses:
        "200":
          description: Received
        "400":
          description: Invalid signature or payload

  /check-in/generate-token:
    post:
      tags: [Check-in]
      summary: Generate QR token (admin calendar roles)
      security:
        - adminBearer: []
      responses:
        "200":
          description: OK
  /check-in/validate/{token}:
    get:
      tags: [Check-in]
      summary: Validate public check-in token
      description: Returns official Venus contract wording and the matching consent checklist. Legacy/Velocity include `requires_minors_annex` and `patient_is_minor`. Cancelled appointments and expired tokens return 400.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /check-in/complete:
    post:
      tags: [Check-in]
      summary: Sign contract and complete check-in
      description: Signs the linked draft/pending contract (or creates one), stores Venus consent, and confirms the appointment. Velocity walk-in notes persist `selected_zones`. Legacy/Velocity minors require tutor name, relationship, and signature. Cancelled appointments, expired tokens, duplicate check-in, incomplete consent, or incomplete minors annex return 400.
      responses:
        "200":
          description: OK
        "400":
          description: Cancelled, expired, already checked in, or incomplete Venus consent
  /patient/packages:
    get:
      tags: [Patient]
      summary: Remaining prepaid package sessions
      parameters:
        - in: query
          name: patient_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Open contracts with remaining session counts, Velocity zones, guarantee status, and suggested next date
        "401":
          description: No session
  /admin/consents/{id}/complete:
    post:
      tags: [Admin Contracts]
      security:
        - adminBearer: []
      summary: Clinician signs informed consent
      description: Sets apto/no_apto/pendiente and staff signature. Apto marks the consent signed. Restricted to general_admin and doctor.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
        "400":
          description: Missing conclusion or signature
  /admin/contracts/{id}/measurements:
    post:
      tags: [Admin Contracts]
      security:
        - adminBearer: []
      summary: Save Velocity hair-count measurement
      description: Records baseline and/or final hair counts for a contracted zone. Reduction = (inicial − final) / inicial × 100.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved
        "400":
          description: Not a Velocity contract or invalid counts
  /admin/contracts/{id}/evaluate-guarantee:
    post:
      tags: [Admin Contracts]
      security:
        - adminBearer: []
      summary: Evaluate the 90% Velocity guarantee
      description: After session 10 measurements, sets guarantee_status to `active` (free extra sessions) or `met`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evaluated
        "400":
          description: Missing measurements
  /admin/contracts/{id}/guarantee-status:
    post:
      tags: [Admin Contracts]
      security:
        - adminBearer: []
      summary: Set Velocity guarantee status
      description: Staff can suspend extras after the 3-month no-show rule, or reactivate after a written continuity agreement.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
  /patient/appointments:
    get:
      tags: [Patient]
      summary: List the logged-in patient's appointments
      description: Includes rows where the patient is `patient_id` or `booked_by_patient_id`. `can_edit` is true for upcoming scheduled or confirmed appointments.
      responses:
        "200":
          description: OK
  /patient/appointments/{id}/cancel:
    patch:
      tags: [Patient]
      summary: Cancel own appointment
      description: Refunds Stripe when notice is greater than 24 hours. Stripe rows without a PaymentIntent or charge are not marked refunded. Response includes refund_eligible, refund_processed, and penalization_applied.
      responses:
        "200":
          description: Cancelled
        "400":
          description: Past appointment
        "401":
          description: No session
        "404":
          description: Not found / not owned
  /patient/appointments/{id}/reschedule:
    patch:
      tags: [Patient]
      summary: Reschedule own appointment
      responses:
        "200":
          description: OK
        "409":
          description: Slot taken
  /patient/appointments/{id}/request-invoice:
    post:
      tags: [Patient]
      summary: Request a fiscal invoice
      responses:
        "200":
          description: OK
        "409":
          description: Already requested
  /patient/profile:
    get:
      tags: [Patient]
      summary: Get patient profile
      responses:
        "200":
          description: OK
    put:
      tags: [Patient]
      summary: Update patient profile
      responses:
        "200":
          description: OK
  /patient/contracts/{id}/download:
    get:
      tags: [Patient]
      summary: Download own signed contract PDF
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: patient_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF

  /admin/auth/check-user:
    post:
      tags: [Admin Auth]
      summary: Check staff email
      responses:
        "200":
          description: OK
  /admin/auth/send-code:
    post:
      tags: [Admin Auth]
      summary: Send staff OTP
      responses:
        "200":
          description: OK
  /admin/auth/verify-code:
    post:
      tags: [Admin Auth]
      summary: Verify staff OTP and issue JWTs
      responses:
        "200":
          description: accessToken, refreshToken, user
  /admin/auth/refresh:
    post:
      tags: [Admin Auth]
      summary: Rotate admin access + refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New tokens
        "401":
          description: Invalid refresh

  /admin/dashboard/stats:
    get:
      tags: [Admin Dashboard]
      security:
        - adminBearer: []
      summary: Alias of metrics (admin, general_admin)
      responses:
        "200":
          description: OK
  /admin/dashboard/metrics:
    get:
      tags: [Admin Dashboard]
      security:
        - adminBearer: []
      summary: Dashboard KPIs in clinic timezone
      responses:
        "200":
          description: OK
  /admin/dashboard/revenue-chart:
    get:
      tags: [Admin Dashboard]
      security:
        - adminBearer: []
      summary: Revenue chart
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [week, month, year]
      responses:
        "200":
          description: OK
  /admin/dashboard/activity:
    get:
      tags: [Admin Dashboard]
      security:
        - adminBearer: []
      summary: Recent appointments, payments, contracts
      responses:
        "200":
          description: OK
  /admin/dashboard/calendar:
    get:
      tags: [Admin Dashboard]
      security:
        - adminBearer: []
      summary: Calendar appointments (includes receptionist, pos)
      description: Each event includes `contract_id`, `contract_number`, and `contract_status` when a draft or signed contract is linked.
      responses:
        "200":
          description: OK

  /admin/services:
    get:
      tags: [Admin Services]
      security:
        - adminBearer: []
      summary: List admin services
      responses:
        "200":
          description: OK
    post:
      tags: [Admin Services]
      security:
        - adminBearer: []
      summary: Create service (accepts image_url)
      responses:
        "201":
          description: Created
  /admin/uploads:
    post:
      tags: [Admin Services]
      security:
        - adminBearer: []
      summary: Upload a file to Vercel Blob (images or PDF)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type, data_base64]
              properties:
                filename: { type: string }
                content_type: { type: string }
                data_base64: { type: string }
                folder:
                  type: string
                  enum: [services, contracts, invoices, brand, media, uploads]
      responses:
        "200":
          description: Blob URL
        "401":
          description: Missing admin JWT
        "403":
          description: Role not allowed
        "503":
          description: Blob store not configured
  /admin/services/{id}:
    put:
      tags: [Admin Services]
      security:
        - adminBearer: []
      summary: Update service
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
    delete:
      tags: [Admin Services]
      security:
        - adminBearer: []
      summary: Delete service
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  /admin/patients:
    get:
      tags: [Admin Patients]
      security:
        - adminBearer: []
      summary: List patients
      responses:
        "200":
          description: OK
    post:
      tags: [Admin Patients]
      security:
        - adminBearer: []
      summary: Create a walk-in / admin patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email]
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
      responses:
        "201":
          description: Created
        "409":
          description: Email already exists
  /admin/patients/{id}:
    get:
      tags: [Admin Patients]
      security:
        - adminBearer: []
      summary: Patient detail
      description: Expediente payload includes appointments, payments, medical records, contracts (folio, zones, guarantee — no signature blobs), and Venus consents (health answers + signature flags).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
    patch:
      tags: [Admin Patients]
      security:
        - adminBearer: []
      summary: Update patient
      description: Whitelist includes `notes` (patients.notes). Unknown columns are ignored.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "400":
          description: No valid fields
  /admin/patients/{id}/toggle-active:
    patch:
      tags: [Admin Patients]
      security:
        - adminBearer: []
      summary: Toggle patient active
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /admin/patients/{id}/medical-records:
    post:
      tags: [Admin Medical Records]
      security:
        - adminBearer: []
      summary: Add medical record on a patient
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  /admin/medical-records:
    get:
      tags: [Admin Medical Records]
      security:
        - adminBearer: []
      summary: List medical records (general_admin, doctor)
      responses:
        "200":
          description: OK
    post:
      tags: [Admin Medical Records]
      security:
        - adminBearer: []
      summary: Create medical record
      responses:
        "200":
          description: OK
  /admin/medical-records/{id}:
    get:
      tags: [Admin Medical Records]
      security:
        - adminBearer: []
      summary: Get medical record
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
    put:
      tags: [Admin Medical Records]
      security:
        - adminBearer: []
      summary: Update medical record
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
    delete:
      tags: [Admin Medical Records]
      security:
        - adminBearer: []
      summary: Delete medical record
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  /admin/users:
    get:
      tags: [Admin Users]
      security:
        - adminBearer: []
      summary: List staff (general_admin)
      responses:
        "200":
          description: OK
    post:
      tags: [Admin Users]
      security:
        - adminBearer: []
      summary: Create staff user
      responses:
        "200":
          description: OK
  /admin/users/{id}:
    get:
      tags: [Admin Users]
      security:
        - adminBearer: []
      summary: Get staff user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
    put:
      tags: [Admin Users]
      security:
        - adminBearer: []
      summary: Update staff user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
    delete:
      tags: [Admin Users]
      security:
        - adminBearer: []
      summary: Delete staff user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /admin/users/{id}/toggle-active:
    patch:
      tags: [Admin Users]
      security:
        - adminBearer: []
      summary: Toggle staff active flag
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  /admin/appointments:
    get:
      tags: [Admin Appointments]
      security:
        - adminBearer: []
      summary: List admin appointments
      responses:
        "200":
          description: OK
  /admin/appointments/manual:
    post:
      tags: [Admin Appointments]
      security:
        - adminBearer: []
      summary: Create walk-in / manual appointment
      description: |
        Accepts `patient_id` or `new_patient` `{ first_name, last_name, email, phone }`.
        Venus packages require `selected_areas` (Bliss/Legacy exactly one catalog area; Velocity 1–4).
        `created_by` is always the JWT admin (client `created_by` is ignored).
        Duration uses the multi-zone Velocity rule. Notes prepend `Área: …`.
        If the patient has remaining matching sessions or an active 90% guarantee, payment is skipped
        (`skip_payment: true`) and the existing contract is linked. Otherwise a Venus charge records
        the catalog amount (not the client `payment_amount`) and an official draft contract is created.
        Non-Venus / inactive historic SKUs still accept a client amount with no zone requirement.
        Blocked clinic dates return 400 (`reason: blocked_date`). A duration overlap with a
        `scheduled`/`confirmed`/`in_progress` visit returns 409 (`reason: slot_conflict`).
        Same-day creates take a `schedule_day_locks` row so two receptionists cannot both insert
        after seeing a free slot. Admin and patient reschedule use the same overlap rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id, scheduled_date, scheduled_time]
              properties:
                patient_id:
                  type: integer
                new_patient:
                  type: object
                service_id:
                  type: integer
                scheduled_date:
                  type: string
                scheduled_time:
                  type: string
                selected_areas:
                  type: array
                  items:
                    type: string
                notes:
                  type: string
                payment_amount:
                  type: number
                payment_method:
                  type: string
                  enum: [cash, credit_card, transfer, card]
      responses:
        "201":
          description: Created (`id`, `patient_id`, `contract_id`, `skip_payment`, `catalog_amount`, `duration_minutes`)
        "400":
          description: Missing patient, invalid zones, invalid payment method, or blocked date
        "409":
          description: Time slot already reserved (`reason: slot_conflict`)
  /admin/appointments/{id}/payment-info:
    get:
      tags: [Admin Appointments]
      security:
        - adminBearer: []
      summary: Payment info for an appointment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /admin/appointments/{id}/status:
    patch:
      tags: [Admin Appointments]
      security:
        - adminBearer: []
      summary: Update appointment status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
